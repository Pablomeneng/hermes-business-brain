name: hermes-business-brain
version: 0.1.0
manifest_version: 2
api_version: 1

description: >
  Offline Obsidian "business brain" toolkit: create and validate business vaults,
  query contextual knowledge, capture findings, map knowledge, manage typed
  relations, run a local external-reference registry, plan readable renames, and
  drive a transcript custody-and-analysis pipeline — all as local subprocesses over
  user-provided paths, with no network access and no real business data shipped.

author: unsulabs
license: MIT
homepage: https://github.com/unsulabs/Obsidian-Bussines-Brain

python_dependencies:
  - "PyYAML==6.0.3"
  - "jsonschema>=4.23,<5"

provides_tools:
  - brain_doctor
  - brain_create_vault
  - brain_validate_vault
  - brain_status
  - brain_register_vault
  - brain_resolve_vault
  - brain_query
  - brain_capture
  - brain_knowledge_map
  - brain_relations
  - brain_references
  - brain_naming
  - brain_transcript_cycle
